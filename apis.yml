description: HelloGold is a Malaysian fintech company operating a mobile gold-savings app that lets everyday
  users buy, save, sell, send, and redeem 99.99% investment-grade gold starting from as little as RM1, with
  physical redemption from a minimum of 1 gram. Its SmartSaver feature runs an automated 12-month savings
  plan that buys gold at the lowest weekday price on the user's behalf. The service is Shariah-compliant
  (certified by Amanie Advisors), with gold stored in an insured and audited Singapore vault. HelloGold is
  a portfolio company of 500 Global and a recognized Islamic-fintech player. This profile is a consumer
  mobile-app company with no public developer/API surface identified during enrichment.
